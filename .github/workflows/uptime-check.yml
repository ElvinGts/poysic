name: PoySic Uptime & Keep-Alive Check

on:
  schedule:
    # Ping every 10 minutes to prevent Render free-tier instance spin-down
    - cron: '*/10 * * * *'
  workflow_dispatch: # Allows manual trigger from GitHub Actions tab

jobs:
  ping-health:
    name: Health Check Ping
    runs-on: ubuntu-latest
    steps:
      - name: Ping PoySic Health Endpoint
        run: |
          RENDER_URL="${{ secrets.POYSIC_RENDER_URL }}"
          if [ -z "$RENDER_URL" ]; then
            echo "POYSIC_RENDER_URL secret is not set yet. Skipping live ping until URL is configured."
            exit 0
          fi
          echo "Pinging $RENDER_URL/api/health..."
          HTTP_STATUS=$(curl -s -o /dev/null -w "%{http_code}" "$RENDER_URL/api/health")
          echo "Received HTTP status: $HTTP_STATUS"
          if [ "$HTTP_STATUS" -ne 200 ]; then
            echo "Warning: Expected HTTP 200, received $HTTP_STATUS"
            exit 1
          fi
          echo "PoySic instance is healthy and active."
