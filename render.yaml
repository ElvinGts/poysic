services:
  - type: web
    name: poysic
    env: node
    plan: free
    buildCommand: npm run install:all && npm run build
    startCommand: npm start
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 10000
      - key: JAMENDO_CLIENT_ID
        value: 709fa152
